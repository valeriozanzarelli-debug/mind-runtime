name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[full]" pyinstaller

      - name: Build EXE
        run: python -m PyInstaller packaging/organism_windows.spec --noconfirm --clean

      - name: Copy to static releases (for site mirror)
        run: |
          New-Item -ItemType Directory -Force -Path organism/nursery/static/releases
          Copy-Item dist/ORGANISM-Windows.exe organism/nursery/static/releases/ORGANISM-Windows.exe

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ORGANISM-Windows
          path: dist/ORGANISM-Windows.exe
          retention-days: 90

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/ORGANISM-Windows.exe
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
