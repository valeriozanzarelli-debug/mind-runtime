name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[full,mindruntime]" pyinstaller tzdata

      - name: Build EXE
        run: python -m PyInstaller packaging/organism_windows.spec --noconfirm --clean

      - name: Smoke test EXE exists
        shell: pwsh
        run: |
          if (-not (Test-Path dist/ORGANISM-Windows.exe)) { throw "EXE missing" }
          (Get-Item dist/ORGANISM-Windows.exe).Length / 1MB

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ORGANISM-Windows
          path: dist/ORGANISM-Windows.exe
          retention-days: 90

      - name: Remove old windows-latest release
        shell: bash
        run: |
          gh release delete windows-latest -y || true
          git push origin :refs/tags/windows-latest || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish windows-latest release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: windows-latest
          name: ORGANISM Windows (latest)
          prerelease: true
          files: dist/ORGANISM-Windows.exe
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish versioned release on tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/ORGANISM-Windows.exe
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
