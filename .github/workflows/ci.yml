name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: python -m pytest -v --ignore=tests/test_comprehension.py --ignore=tests/test_presence.py --ignore=tests/test_semantic_story.py --ignore=tests/test_superego.py --ignore=tests/test_ventral_vision.py --ignore=tests/test_visual_sea.py --ignore=tests/test_workspace_vision.py
      - run: python -m mind.cli demo
