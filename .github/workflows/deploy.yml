# Deploy mind-runtime su Hetzner (inkconscius.eu/organism)
# Secrets: PRIVATE_SSH_KEY (or SSH_PRIVATE_KEY)
name: Deploy to production

on:
  workflow_dispatch:
    inputs:
      restart_training:
        description: Avvia training se non già attivo
        type: boolean
        default: false
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to server
        env:
          SSH_PRIVATE_KEY: ${{ secrets.PRIVATE_SSH_KEY }}
          DEPLOY_HOST: 46.225.222.101
          DEPLOY_USER: root
        run: |
          set -euo pipefail
          if [[ -z "${SSH_PRIVATE_KEY:-}" ]]; then
            echo "::error::Missing PRIVATE_SSH_KEY secret"
            exit 1
          fi
          KEY_FILE=/tmp/mind_runtime_deploy_key
          # write_deploy_key.sh lives in ink-app; inline minimal key write if missing
          if [[ -f ci/write_deploy_key.sh ]]; then
            bash ci/write_deploy_key.sh "$KEY_FILE"
          else
            printf '%s\n' "$SSH_PRIVATE_KEY" > "$KEY_FILE"
            chmod 600 "$KEY_FILE"
          fi
          SSH_OPTS=(-o StrictHostKeyChecking=accept-new -o BatchMode=yes -i "$KEY_FILE" -o IdentitiesOnly=yes)
          SSH=(ssh "${SSH_OPTS[@]}")
          RSYNC_RSH="ssh ${SSH_OPTS[*]}"

          echo "=== rsync to /opt/mind-runtime ==="
          rsync -az --delete -e "$RSYNC_RSH" \
            --exclude '.git' --exclude '.pytest_cache' --exclude '__pycache__' \
            --exclude '*.egg-info' --exclude '.venv' \
            --exclude 'data/baby_state.json' --exclude 'data/*.tmp' \
            ./ "${DEPLOY_USER}@${DEPLOY_HOST}:/opt/mind-runtime/"

          echo "=== install + restart nursery ==="
          "${SSH[@]}" "${DEPLOY_USER}@${DEPLOY_HOST}" "bash -s" <<'REMOTE'
          set -euo pipefail
          INSTALL_DIR=/opt/mind-runtime
          VENV="${INSTALL_DIR}/.venv"
          export ORGANISM_DNA_VARIANT="${ORGANISM_DNA_VARIANT:-genesis}"

          python3 -m venv "${VENV}" 2>/dev/null || true
          "${VENV}/bin/pip" install -q --upgrade pip
          if [[ -f "${INSTALL_DIR}/pyproject.toml" ]]; then
            "${VENV}/bin/pip" install -q -e "${INSTALL_DIR}[full]" 2>/dev/null \
              || "${VENV}/bin/pip" install -q -e "${INSTALL_DIR}" 2>/dev/null || true
          fi
          "${VENV}/bin/pip" install -q pyyaml 2>/dev/null || true

          UNIT="${INSTALL_DIR}/deploy/systemd/organism-nursery.service"
          if [[ -f "$UNIT" ]]; then
            cp "$UNIT" /etc/systemd/system/
            systemctl daemon-reload
            systemctl restart organism-nursery.service
            sleep 4
          fi
          chown www-data:www-data "${INSTALL_DIR}/data/baby_state.json" 2>/dev/null || true
          chmod 664 "${INSTALL_DIR}/data/baby_state.json" 2>/dev/null || true
          systemctl is-active organism-nursery.service
          curl -sf --max-time 10 http://127.0.0.1:8765/organism/api/baby/ready >/dev/null && echo "nursery ok"
          REMOTE

          rm -f "$KEY_FILE"

      - name: Verify public API
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 20 https://inkconscius.eu/organism/api/baby/ready || echo "000")
          echo "ready -> ${code}"
          [[ "$code" == "200" ]]
