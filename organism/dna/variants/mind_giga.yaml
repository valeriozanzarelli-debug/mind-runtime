# Mente massima per server ~16 GB RAM — ~4M neuroni pensanti
genome_version: "0.1.0-mind-giga"
species: OrganismMindGiga

scale:
  neuron_multiplier: 2300
  connection_multiplier: 0.95
  sparse_fan_out_cap: 5
  energy_budget_per_tick: 650000

neuron_counts:
  motion_gesture_emitter: 0
  song_melody_composer: 8
  pattern_matcher: 420
  memory_consolidator: 340
  emotion_modulator: 200
  text_semantic_encoder: 192
  vision_edge_detector: 320

fractal_expansion:
  enabled: true
  depth: 3
  branching_factor: 3
  neurons_per_leaf: 5

growth_rules:
  sensory_to_associative:
    connections_per_neuron: 5
    pruning_threshold: 0.12
  pattern_to_memory:
    connections_per_neuron: 4
  memory_to_motor:
    connections_per_neuron: 4
  associative_to_associative:
    connections_per_neuron: 3
    weight_init: small_random

plasticity:
  hebbian_learning:
    rate: 0.005
    decay: 0.0005
  homeostatic:
    target_firing_rate: 2.2
    adjustment_rate: 0.0005

pattern_lexicon: {}

motor_defaults:
  speech_emotion: calm
  motion_style: disembodied

mind:
  locomotion: float_fly
  body: false

baby:
  locale: it-IT
