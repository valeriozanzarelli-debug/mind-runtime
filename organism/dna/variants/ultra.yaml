# Profilo ultra — ~5M neuroni, massima sparsità
genome_version: "0.1.0-ultra"
species: OrganismUltra

scale:
  neuron_multiplier: 4000
  connection_multiplier: 1.0
  sparse_fan_out_cap: 4
  energy_budget_per_tick: 800000

fractal_expansion:
  enabled: true
  depth: 3
  branching_factor: 3
  neurons_per_leaf: 3

growth_rules:
  sensory_to_associative:
    connections_per_neuron: 4
    pruning_threshold: 0.14

  pattern_to_memory:
    connections_per_neuron: 3

  memory_to_motor:
    connections_per_neuron: 4

  associative_to_associative:
    connections_per_neuron: 2
    weight_init: small_random

plasticity:
  hebbian_learning:
    rate: 0.004
    decay: 0.0004
  homeostatic:
    target_firing_rate: 2.0
    adjustment_rate: 0.0004

pattern_lexicon: {}

baby:
  locale: it-IT
