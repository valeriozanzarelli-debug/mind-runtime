# Profilo giga — ~3M neuroni, connettività molto sparsa
genome_version: "0.1.0-giga"
species: OrganismGiga

scale:
  neuron_multiplier: 2300
  connection_multiplier: 1.0
  sparse_fan_out_cap: 5
  energy_budget_per_tick: 500000

fractal_expansion:
  enabled: true
  depth: 3
  branching_factor: 3
  neurons_per_leaf: 4

growth_rules:
  sensory_to_associative:
    connections_per_neuron: 5
    pruning_threshold: 0.12

  pattern_to_memory:
    connections_per_neuron: 4

  memory_to_motor:
    connections_per_neuron: 5

  associative_to_associative:
    connections_per_neuron: 2
    weight_init: small_random

plasticity:
  hebbian_learning:
    rate: 0.005
    decay: 0.0005
  homeostatic:
    target_firing_rate: 2.0
    adjustment_rate: 0.0005

pattern_lexicon: {}

baby:
  locale: it-IT
