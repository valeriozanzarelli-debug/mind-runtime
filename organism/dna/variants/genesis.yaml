# Genesis — capacità innate (parlare, pensare), zero informazioni sul mondo.
# DNA evolvibile: parametri aggiornati da DNAEvolver → data/dna/evolved_genesis.yaml
genome_version: "0.2.0-genesis"
species: OrganismGenesis

scale:
  neuron_multiplier: 28
  connection_multiplier: 0.72
  sparse_fan_out_cap: 24
  energy_budget_per_tick: 48000

fractal_expansion:
  enabled: true
  depth: 3
  branching_factor: 4
  neurons_per_leaf: 12

growth_rules:
  sensory_to_associative:
    connections_per_neuron: 28
  pattern_to_memory:
    connections_per_neuron: 22
  memory_to_motor:
    connections_per_neuron: 24
  associative_to_associative:
    connections_per_neuron: 14

plasticity:
  hebbian_learning:
    rate: 0.012
    decay: 0.0005
  spike_timing_dependent:
    window_ms: 22
    potentiation: 0.055
    depression: 0.018

cognition:
  spreading_activation_threshold: 0.3
  episodic_decay: 0.0005
  thought_loop_interval_s: [2.0, 5.0]
  narrator_observe_ms: [200, 500]

pattern_lexicon: {}

motor_defaults:
  speech_emotion: calm
  song_style: ambient
  motion_style: neutral

baby:
  locale: it-IT
  genesis: true
  bootstrap_speech: true
  bootstrap_thought: true
  empty_knowledge: true
  research_topics: []

evolution:
  enabled: true
  generation: 0
  targets:
    min_discourse_words: 8
    min_thought_coherence: 0.55
    max_babble_ratio: 0.25
