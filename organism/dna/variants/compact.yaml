# Profilo compact — ~15k neuroni, ~200MB RAM (server senza margine)
genome_version: "0.1.0-compact"
species: OrganismCompact

scale:
  neuron_multiplier: 10
  connection_multiplier: 0.35
  sparse_fan_out_cap: 10
  energy_budget_per_tick: 25000

fractal_expansion:
  enabled: true
  depth: 2
  branching_factor: 3
  neurons_per_leaf: 6

growth_rules:
  sensory_to_associative:
    connections_per_neuron: 12
  pattern_to_memory:
    connections_per_neuron: 8
  memory_to_motor:
    connections_per_neuron: 10
  associative_to_associative:
    connections_per_neuron: 6

pattern_lexicon: {}

baby:
  locale: it-IT
