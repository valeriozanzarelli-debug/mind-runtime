# Profilo MENTE — senza corpo motorio, solo pensiero + linguaggio
# Rimuove gesture/song pesanti; potenzia corteccia associativa e memoria.
genome_version: "0.1.0-mind"
species: OrganismMind

scale:
  neuron_multiplier: 1.0
  connection_multiplier: 1.0
  sparse_fan_out_cap: 9
  energy_budget_per_tick: 120000

# Zero corpo — conserva solo output linguistico (non è muscolo)
neuron_counts:
  motion_gesture_emitter: 0
  song_melody_composer: 12
  pattern_matcher: 420
  memory_consolidator: 340
  emotion_modulator: 200
  text_semantic_encoder: 192
  vision_edge_detector: 320

fractal_expansion:
  enabled: true
  depth: 3
  branching_factor: 3
  neurons_per_leaf: 14
  template_subtype: pattern_matcher

growth_rules:
  sensory_to_associative:
    connections_per_neuron: 9
  pattern_to_memory:
    connections_per_neuron: 7
  memory_to_motor:
    connections_per_neuron: 6
  associative_to_associative:
    connections_per_neuron: 5

plasticity:
  hebbian_learning:
    rate: 0.009
    decay: 0.0007
  homeostatic:
    target_firing_rate: 2.8
    adjustment_rate: 0.0007

pattern_lexicon: {}

motor_defaults:
  speech_emotion: calm
  motion_style: disembodied

mind:
  locomotion: float_fly
  body: false

baby:
  locale: it-IT
