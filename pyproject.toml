[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cerebrum"
version = "1.0.0"
description = "CEREBRUM — runtime cerebrale locale (GPU) per Ink Admin. Tutto gira sul PC dell'utente."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.24",
]

[project.optional-dependencies]
gpu = ["torch>=2.0"]
vision = ["pillow>=10.0"]
full = ["torch>=2.0", "pillow>=10.0", "pytest>=8.0"]
dev = ["pytest>=8.0"]

[project.scripts]
cerebrum = "cerebrum.cli:main"

[tool.setuptools.packages.find]
include = ["cerebrum*"]
